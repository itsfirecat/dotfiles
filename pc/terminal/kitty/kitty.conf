# Generated by Konfig — https://github.com/ChakerBelhadjAmor/Konfig
# Theme: custom

# --- Colors & Theme ---

# Main foreground (text) color
foreground #c0caf5

# Main background color
background #1a1b26

# Selection colors
selection_foreground #c0caf5
selection_background #33467c

# Cursor colors
cursor #c0caf5
cursor_text_color #1a1b26
cursor_shape block

# URL color
url_color #73daca

# ANSI color palette
# Black
color0 #15161e
# Red
color1 #f7768e
# Green
color2 #9ece6a
# Yellow
color3 #e0af68
# Blue
color4 #7aa2f7
# Magenta
color5 #bb9af7
# Cyan
color6 #7dcfff
# White
color7 #a9b1d6
# Bright Black
color8 #414868
# Bright Red
color9 #f7768e
# Bright Green
color10 #9ece6a
# Bright Yellow
color11 #e0af68
# Bright Blue
color12 #7aa2f7
# Bright Magenta
color13 #bb9af7
# Bright Cyan
color14 #7dcfff
# Bright White
color15 #c0caf5

# --- Font & Text ---

# Primary font family
font_family Fira Code

# Font size in points
font_size 12

bold_font auto
italic_font auto
bold_italic_font auto

# Line height (multiplier)
adjust_line_height 1

disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# --- Window & Layout ---

# Padding inside the terminal window (in pts)
window_padding_width 10

# Margin around the terminal window
window_margin_width 0

# Background transparency (1.0 = fully opaque)
background_opacity 0.95

# Window decoration style
window_decorations none

# Initial terminal size in columns x rows
remember_window_size no
initial_window_width 100c
initial_window_height 35c

resize_debounce_time 0.1

# --- Performance & Behavior ---

# Time between screen redraws (ms)
repaint_delay 10

# Delay before processing input (ms)
input_delay 3

sync_to_monitor yes

# Bell settings
enable_audio_bell yes
visual_bell_duration 0.0

mouse_hide_wait 3.0
copy_on_select no
focus_follows_mouse no

# Number of lines of scrollback history
scrollback_lines 2000

# --- Shell & Startup ---

# Shell program to run
shell .

# Text editor
editor .

close_on_child_death no

# --- Keyboard Shortcuts ---

map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+enter new_window
map ctrl+shift+w close_window
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

